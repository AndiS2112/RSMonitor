<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discovery console</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5AA9FF}a:hover{color:#8CC4FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1114; color: #E8ECEF; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 28px; gap: 18px">
<header style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600">Discovery console</h1>
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #8A949E">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #5AA9FF"></span>OBDII adapter · connected · ELM327 v1.5
</div>
</header>

<div role="group" aria-label="Target control unit" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #161B20; border-radius: 12px; padding: 4px">
<button style="height: 44px; border: none; border-radius: 9px; background: transparent; color: #C3CAD1; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500">Engine · 7E0</button>
<button aria-pressed="true" style="height: 44px; border: none; border-radius: 9px; background: #1F3550; color: #E8ECEF; font-family: Inter, sans-serif; font-size: 14px; font-weight: 600">Gearbox · 7E1</button>
</div>

<section aria-label="Log" style="flex: 1; background: #07090B; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 9px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.35; overflow: hidden">
<sc-for list="{{log}}" as="row" hint-placeholder-count="9">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; gap: 10px"><span style="color: #5AA9FF">›</span><span style="color: #E8ECEF">{{row.cmd}}</span></div>
<div style="padding-left: 18px; color: {{row.color}}">{{row.reply}}</div>
</div>
</sc-for>
</section>

<section aria-label="Decode candidate" style="background: #161B20; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #C3CAD1">DECODE CHECK</div>
<div style="font-size: 12px; color: #8A949E">vs VCDS reading</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; color: #8A949E">Raw</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 15px">0x7B</div></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; color: #8A949E">Formula</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 15px">A − 40</div></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 11px; color: #8A949E">Result</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 15px">83 °C</div></div>
</div>
</section>

<form style="display: flex; gap: 8px" aria-label="Send command">
<label for="cmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Command</label>
<input id="cmd" type="text" placeholder="22 [ID]" style="flex: 1; height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #2C343C; background: #0E1114; color: #E8ECEF; padding: 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 15px">
<button type="button" style="height: 48px; padding: 0 20px; border: none; border-radius: 12px; background: #5AA9FF; color: #07090B; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">Send</button>
</form>

<a href="Main.dc.html" style="height: 48px; border-radius: 12px; border: 1px solid #2C343C; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #E8ECEF; font-size: 15px; font-weight: 500">Add as gauge</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var ok = '#8A949E', hit = '#E8ECEF', miss = '#FF8A3D', wait = '#5AA9FF';
    return {
      log: [
        { cmd: 'ATZ', reply: 'ELM327 v1.5', color: ok },
        { cmd: 'ATE0 · ATL0 · ATS0 · ATH1', reply: 'OK', color: ok },
        { cmd: 'ATSP6', reply: 'OK  (CAN 11-bit, 500k)', color: ok },
        { cmd: 'ATSH7E0', reply: 'OK', color: ok },
        { cmd: '0105', reply: '7E8 03 41 05 7B  → coolant 83 °C', color: hit },
        { cmd: '015C', reply: 'NO DATA  (oil temp not on generic PID)', color: miss },
        { cmd: 'ATSH7E1', reply: 'OK', color: ok },
        { cmd: '22 [ID]', reply: 'waiting for candidate ID…', color: wait }
      ]
    };
  }
}
</script>
</body>
</html>
