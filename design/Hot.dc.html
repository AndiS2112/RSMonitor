class Component extends DCLogic {
  needle(v, lo, hi, red, side) {
    var c = Math.max(lo, Math.min(hi, v));
    var t = c <= 100 ? 150 - 60 * (c - lo) / (100 - lo) : 90 - 60 * (c - 100) / (hi - 100);
    return { angle: (side * t).toFixed(1), value: Math.round(v), color: v >= red ? '#FF1A1A' : '#FFFFFF' };
  }
  renderVals() {
    var lat = this.props.gLat ?? -0.55;
    var lon = this.props.gLon ?? 0.2;
    return {
      oil: this.needle(this.props.oilTemp ?? 141, 50, 150, 130, -1),
      gear: this.needle(this.props.gearTemp ?? 126, 50, 130, 120, 1),
      g: { x: (162.0 + lat * 60).toFixed(1), y: (162.0 - lon * 60).toFixed(1) }
    };
  }
}
</script>
