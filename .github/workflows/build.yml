name: Build APK

on:
  push:
    paths:
      - 'app/**'
      - 'signing/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the rendered previews to the "previews" branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Test and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      # The gauge screen as drawn by the app, one PNG per state, on a branch of its own
      # so the images can be viewed and linked without downloading an artifact.
      - name: Publish previews to the previews branch
        if: always()
        run: |
          cd app/build/outputs/gauge-previews || exit 0
          git init -q -b previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Gauge previews for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gauge-previews
          path: app/build/outputs/gauge-previews/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: rs-monitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
